#
####################################################################################################
#                                      [build-system]
####################################################################################################

[build-system]

build-backend = "uv_build"
requires = ["uv-build>=0.12, <1.0"]

#
####################################################################################################
#                                      [project]
####################################################################################################

[project]

name = "dmyersturnbull.github.io"
version = "0.2.0"
requires-python = "~=3.14.0"
readme = { file = "README.md", content-type = "text/markdown" }
description = "GitHub Pages https://dmyersturnbull.github.io"
maintainers = [ { name = "Douglas Myers-Turnbull", email = "dmyersturnbull@gmail.com" } ]
authors = [ { name = "Douglas Myers-Turnbull", email = " dmyersturnbull@gmail.com" } ]
license = { text = "CC-BY-SA-4.0" }

classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: 3.14",
  "Programming Language :: Python :: 3 :: 3.15",
  "Typing :: Typed",
]

# -------------------------- project URIs -------------------------------------
[project.urls]
# ::tyranno:: "https://github.com/$<<.frag>>"
Homepage = "https://github.com/dmyersturnbull/dmyersturnbull.github.io"
# ::tyranno:: "https://github.com/$<<.frag>>"
Source = "https://github.com/dmyersturnbull/dmyersturnbull.github.io"
# ::tyranno:: Documentation = https://$<<.vendor>>.github.io/$<<project.name>>
Documentation = "https://dmyersturnbull.github.io/dmyersturnbull.github.io"
# ::tyranno:: "Issue Tracker" = $<<.home>>/issues
Tracker = "https://github.com/dmyersturnbull/dmyersturnbull.github.io/issues"
#
####################################################################################################
#                                      [dependency-groups]
####################################################################################################

# See https://docs.astral.sh/uv/concepts/projects/dependencies/#dependency-groups
[dependency-groups]

# uv includes `dev` by default and has dedicated `--only-dev` / `--no-dev` / etc. switches.
# The other groups are used in CI.
dev = [
  {include-group = "docs"},
  {include-group = "lint"},
  {include-group = "git-hooks"},
]

docs = [
  "zensical>=0.0.66", # https://zensical.org/
]

# Python-ecosystem lint tools that can be called directly
lint = [
  "ruff>=0.16.9",
  "ty>=0.0.84", # Astral's fledgling type checker.
]

# Prek and any dependencies for local hooks
git-hooks = [
  "pathvalidate>=3.3", # Needed for local prek hook.
  "prek>=0.5.4",
]

#
####################################################################################################
#                                      [tool.ruff]
####################################################################################################

[tool.ruff]
exclude = [] # Rely on https://docs.astral.sh/ruff/settings/#respect-gitignore
src = ["src"] # Needed for import sorting
line-length = 100 # Keep consistent with `.editorconfig`.
preview = true

# -------------------------- Ruff formatter -----------------------------------
[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true

# -------------------------- Ruff linter --------------------------------------
[tool.ruff.lint]

# It's simpler to select all rules and ignore the few we don't want.
select = ["ALL"]

ignore = [
  # Rules that conflict with the formatter:
  # (See https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules)
  "tab-indentation",
  "indentation-with-invalid-multiple",
  "indentation-with-invalid-multiple-comment",
  "over-indented",
  "incorrect-blank-line-before-class",
  "docstring-tab-indentation",
  "triple-single-quotes",
  "Q",
  "missing-trailing-comma",
  "prohibited-trailing-comma",
  "multi-line-implicit-string-concatenation",
  "line-too-long",
  # Other ignored rules:
  # Syntax of comments: <rule-description> '(' <reason-ignored> ')'
  "D1", # undocumented public __ (omit useless comments)
  "non-imperative-mood", # imperative mood (nitpicky rule)
  "undocumented-param", # undocumented param (omit useless comments)
  "docstring-missing-returns", # missing `Returns:` (omit useless comments)
  "docstring-missing-yields", # missing `Yields:` (omit useless comments)
  "docstring-missing-exception", # missing `Raises:` exception (omit useless comments)
  "docstring-extraneous-exception", # `Raises` lists exeption not raised directly (often helpful to list anyway)
  "line-contains-todo", # TO*DO (consider TO*DO non-crucial tasks, whereas FIX*ME are crucial)
  "magic-value-comparison", # magic value (includes 2, 256, 404, etc.)
  "no-self-use", # 'self' not used (total non-issue and unavoidable when overriding)
  "ambiguous-unicode-character-string", # confusable characters in strings (bans useful chars)
  "ambiguous-unicode-character-docstring", # confusable characters in docstrings (bans useful chars)
  "ambiguous-unicode-character-comment", # confusable characters in comments (bans useful chars)
  "parenthesize-chained-operators", # `or x and y` without parentheses (unnecessary)
  "suspicious-pickle-import", # import of pickle (S301 on pickle calls is enough)
  "suspicious-subprocess-import", # import of subprocess (S602/S603 on subprocess calls is enough)
  "TD", # flake8-to*do (requires a specific format)
  "doc-line-too-long", # docstring line too long (use semantic line breaks instead)
]

# Delegated options
flake8-bandit.check-typed-exception = true
flake8-copyright.min-file-size = 2048
flake8-copyright.notice-rgx = "(?m)^# SPDX-License-Identifier: "
flake8-tidy-imports.ban-relative-imports = "all"
isort.detect-same-package = false # use `tool.ruff.src` instead
isort.split-on-trailing-comma = false # conflicts with the formatter
pycodestyle.max-doc-length = 100 # match tool.ruff.line-length
pydocstyle.convention = "google"

# Delegated options for pylint
[tool.ruff.lint.pylint]
max-args = 10 # default is 5
max-positional-args = 5 # default is `max-args`
max-bool-expr = 10 # default is 5
max-public-methods = 30 # default is 20
max-nested-blocks = 4 # default is 5
allow-dunder-method-names = ["__rich_repr__"] # allow custom dunders

[tool.uv.build-backend]
module-name = "empty"
